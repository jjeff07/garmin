[project]
name = "garmin-ssi"
version = "0.2.0"
description = "Log a scuba dive into the MySSI web logbook from a .fit file."
requires-python = ">=3.10"
dependencies = [
    "fitparse>=1.2",
]

[project.optional-dependencies]
# curl_cffi is used opportunistically by _http.py; stdlib urllib is the fallback
# (and the only option on iOS / a-Shell). Not required.
impersonate = ["curl-cffi>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
garmin-ssi-fit = "garmin_ssi.fit_push:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_ssi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
