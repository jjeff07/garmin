[project]
name = "garmin-ssi"
version = "0.1.0"
description = "Fetch the latest Garmin dive and log it into the MySSI web logbook."
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7",
    "fitparse>=1.2",
    "garminconnect>=0.3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
garmin-ssi = "garmin_ssi.refresh:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_ssi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
