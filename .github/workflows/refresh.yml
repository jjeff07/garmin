name: refresh-latest-dive

on:
  # schedule:
    # Every 6h. First run (or any run where the token can't load) does a full
    # SSO login and then writes the fresh token back into the GARMIN_TOKENS
    # secret, so subsequent runs just refresh - no repeated logins.
    # For "log the dive right after I surface", trigger on demand:
    #   gh workflow run refresh-latest-dive
    #   or POST a repository_dispatch {"event_type":"dive"} from a phone shortcut.
    # - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ssi_dive_site_id:
        description: "Override the SSI_DIVE_SITE_ID secret for this run (blank = use the secret). Required overall - a site-less dive is silently dropped. e.g. 1018800=North Olmsted, 1965=White Star Quarry"
        required: false
        default: "1018800"
      ssi_divetype_id:
        description: "SSI dive type: 23 Education / 24 Fun Dive / 138 Scientific / 139 Work"
        required: false
        default: "24"
      ssi_comment:
        description: "Note added to each imported dive"
        required: false
        default: "Imported from Garmin Descent"
      force_push:
        description: "Push even if this dive was already logged"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [dive]

concurrency:
  group: refresh-latest-dive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Refresh latest dive
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_COOKIE: ${{ secrets.GARMIN_COOKIE }}
          GARMIN_CSRF: ${{ secrets.GARMIN_CSRF }}
          GARMIN_APP_VER: ${{ secrets.GARMIN_APP_VER }}
          SSI_USER_ID: ${{ secrets.SSI_USER_ID }}
          SSI_FIRST_NAME: ${{ secrets.SSI_FIRST_NAME }}
          SSI_LAST_NAME: ${{ secrets.SSI_LAST_NAME }}
          SSI_LEADER_ID: ${{ secrets.SSI_LEADER_ID }}
          # MySSI logbook push. Set SSI_EMAIL+SSI_PASSWORD (preferred) or SSI_COOKIE;
          # with neither, the run still writes latest.json and skips the push.
          SSI_EMAIL: ${{ secrets.SSI_EMAIL }}
          SSI_PASSWORD: ${{ secrets.SSI_PASSWORD }}
          SSI_COOKIE: ${{ secrets.SSI_COOKIE }}
          # SSI_DIVE_SITE_ID is REQUIRED (logbook drops a site-less dive). Secret for
          # scheduled runs; the workflow_dispatch input overrides it for one run.
          SSI_DIVE_SITE_ID: ${{ inputs.ssi_dive_site_id || secrets.SSI_DIVE_SITE_ID }}
          # divetype/comment: inputs with defaults; empty on schedule -> refresh.py defaults.
          SSI_DIVETYPE_ID: ${{ inputs.ssi_divetype_id }}
          SSI_COMMENT: ${{ inputs.ssi_comment }}
          OUTPUT_PATH: public/latest.json
          TOKEN_OUT: garmin_tokens.new       # written only if the token changed
        run: uv run garmin-ssi ${{ inputs.force_push == true && '--force-push' || '' }}

      - name: Update GARMIN_TOKENS secret if the token was refreshed
        # always: a refreshed token must be saved even if a later step (SSI push) failed
        if: ${{ always() && hashFiles('garmin_tokens.new') != '' }}
        env:
          # Fine-grained PAT, THIS repo only, permission: Secrets = Read and write.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::token was refreshed but GH_PAT is not set - GARMIN_TOKENS left stale"
          else
            gh secret set GARMIN_TOKENS --repo "${GITHUB_REPOSITORY}" < garmin_tokens.new
            echo "GARMIN_TOKENS updated"
          fi

      - name: Scrub token file
        if: always()
        run: rm -f garmin_tokens.new

      - name: Commit latest.json if changed
        if: always()   # latest.json is written even when the push fails
        run: |
          git config user.name  "garmin-ssi-bot"
          git config user.email "garmin-ssi-bot@users.noreply.github.com"
          git add public/latest.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh latest dive [skip ci]"
            git push
          fi
