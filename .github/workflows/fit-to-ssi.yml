name: fit-to-ssi

# Log a dive into MySSI from a .fit file - no Garmin API.
# An Apple Shortcut exports the dive .fit from the Garmin Connect app and commits
# it to incoming/ via the GitHub Contents API (message must end with [skip ci] so
# this workflow's own archive commit doesn't loop). This then pushes it to MySSI.

on:
  push:
    paths: ["incoming/**.fit"]
  workflow_dispatch:
    inputs:
      path:
        description: "a .fit already in the repo, to test with"
        default: "tests/data/sample_dive.fit"
      ssi_dive_site_id:
        description: "override SSI_DIVE_SITE_ID for this run"
        default: ""

concurrency:
  group: fit-to-ssi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Collect .fit files
        id: collect
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            echo "files=${{ inputs.path }}" >> "$GITHUB_OUTPUT"
          else
            files=$(ls incoming/*.fit 2>/dev/null | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
          echo "found: $files"

      - name: Push to MySSI
        if: steps.collect.outputs.files != ''
        env:
          SSI_EMAIL: ${{ secrets.SSI_EMAIL }}
          SSI_PASSWORD: ${{ secrets.SSI_PASSWORD }}
          SSI_COOKIE: ${{ secrets.SSI_COOKIE }}
          SSI_USER_ID: ${{ secrets.SSI_USER_ID }}
          SSI_FIRST_NAME: ${{ secrets.SSI_FIRST_NAME }}
          SSI_LAST_NAME: ${{ secrets.SSI_LAST_NAME }}
          SSI_LEADER_ID: ${{ secrets.SSI_LEADER_ID }}
          # Site is resolved from the dive's GPS via the public locator; this is
          # only the fallback when there are no coords / no public site nearby.
          SSI_DIVE_SITE_ID: ${{ inputs.ssi_dive_site_id || secrets.SSI_DIVE_SITE_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}   # optional; locator self-fetches one
          SSI_DIVETYPE_ID: ${{ secrets.SSI_DIVETYPE_ID }}
          SSI_COMMENT: ${{ secrets.SSI_COMMENT }}
        run: uv run garmin-ssi-fit ${{ steps.collect.outputs.files }}

      - name: Archive processed files
        if: ${{ always() && steps.collect.outputs.files != '' && github.event_name == 'push' }}
        run: |
          git config user.name  "garmin-ssi-bot"
          git config user.email "garmin-ssi-bot@users.noreply.github.com"
          mkdir -p processed
          for f in ${{ steps.collect.outputs.files }}; do
            [ -f "$f" ] || continue
            git mv "$f" "processed/$(basename "$f")" 2>/dev/null || mv "$f" "processed/"
            b="${f%.fit}.json"; [ -f "$b" ] && { git mv "$b" "processed/$(basename "$b")" 2>/dev/null || mv "$b" "processed/"; }
          done
          git add -A incoming processed state
          if git diff --cached --quiet; then
            echo "nothing to archive"
          else
            git commit -m "chore: processed dive fit(s) [skip ci]"
            git push
          fi
